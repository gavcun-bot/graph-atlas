// Batch links and points by community to minimize Canvas state changes.

// Redraw the selected neighborhood without repainting the base graph.
function highlight() {
    hctx.setTransform(pix, 0, 0, pix, 0, 0);

    if (i < 0 || !active[i])return;

    hctx.lineWidth = 1.05;
    hctx.strokeStyle = g.color;

    hctx.stroke();
    hctx.globalAlpha = 1;
    hctx.fillStyle = g.color;
    hctx.strokeStyle = '#fff';

// Check only the nearby cells while preserving zoom-dependent hit targets.
function nearest(x, y) {

        for (const i of items)scan(i)

        for (let a = ax; a <= bx; a++)for (let b = ay; b <= by; b++) {
            const cell = cells.get(key(a, b));
            if (cell)for (const i of cell)scan(i)

    }

}

        return

    const t = $('tip');
    if (i !== hover || t.hidden) {

        t.replaceChildren(create('strong', '', N[i].label || N[i].id), create('small', '', str(N[i].type) + ' · ' + num(ad[i].length) + ' displayed links'));
        t.hidden = false;

    t.style.top = Math.max(2, Math.min(H - r.height - 3, y + 13)) + 'px'
}

// Handle pointer input for drag, pinch, and record selection.

function pair() {

// Use DOM text nodes for graph labels and evidence.
function clearSelection() {
    choice = - 1;
    visibleEdges = 24;
    $('inspector').hidden = true;
    highlightSoon()
}
function select(i, center) {
    if (!Number.isInteger(i) || !active[i])return;

    choice = i;
    visibleEdges = 24;
    hideTip();
    closeHelpBox();
    closeSearch();

            txt.append(create('strong', '', str(other.label || other.id)), create('small', '', (out ? '→ ': '← ') + str(e[2] || 'Related')));

// Wire the community legend and focus behavior.
const groupRows = new Map();
function buildLegend() {
    const b = $('legendbody'), strip = $('strip');
    b.replaceChildren();
    strip.replaceChildren();
    for (const g of groups.filter(g => g.nodes.length).sort((a, b) => b.nodes.length - a.nodes.length || a.label.localeCompare(b.label))) {
        const k = groupById.get(g.id), r = btn('', () => setGroup(filter === k ? - 1: k, true), 'groupbtn');
        r.title = g.label;
        r.setAttribute('aria-pressed', String(k === filter));
        r.append(dot(g.color), create('span', 'gname', g.label), create('span', 'gcount', num(g.nodes.length)));
        b.append(r);

}
function legendState() {

// Rank search matches using exact identifiers and label prefixes.
let results = [], cursor = - 1;
const search = $('query');
function closeSearch() {
    $('matches').hidden = true;
    search.setAttribute('aria-expanded', 'false');
    search.removeAttribute('aria-activedescendant');
    cursor = - 1
}
function searchMatches() {
    const q = norm(search.value);
    if (!q) {
        closeSearch();
        return
    }
    const tokens = q.split(' '), rs = [];
    for (const i of items) {
        if (!tokens.every(t => queries[i].includes(t)))continue;
        const label = norm(N[i].label), id = norm(N[i].id), tail = norm(str(N[i].id).split(':').pop());
        let rank = (label === q || id === q || tail === q ? 30: 0) + (label.startsWith(q) ? 8: 0) + (tail.startsWith(q) ? 5: 0);
        rs.push([rank, i])

    list.replaceChildren();
    cursor = - 1;
    search.removeAttribute('aria-activedescendant');

        row.id = 'match-' + j;
        row.tabIndex = - 1;

        row.setAttribute('aria-selected', 'false');
        t.append(create('strong', '', n.label || n.id), create('small', '', str(n.type) + ' · ' + g.label));
        row.append(dot(g.color), t);
        list.append(row)

    list.hidden = false;
    search.setAttribute('aria-expanded', 'true')
}

    search.setAttribute('aria-activedescendant', 'match-' + cursor);

search.addEventListener('input', () => {

});
search.addEventListener('focus', () => {
    if (search.value)searchMatches()
});
search.addEventListener('keydown', e => {

        canvas.focus();
        return
    }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
