    color: #163245;

.head .brand {
    width: 30px;
    height: 30px;
    flex: none;
    border-radius: 7px;
    display: grid;
    place-items: center;
    background: #163245;
    color: white;
}
.brand svg { width: 22px; height: 22px; }
.head h1 {
    padding: 0;
    border: 0;
    font-size: 22px;
    letter-spacing: -.04em;
}
.demo-note {
    margin-left: 6px;
    padding-left: 15px;
    border-left: 1px solid var(--faint);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
}
@media (max-width: 620px) {
    .head { height: 48px; flex-basis: 48px; gap: 8px; }
    .head h1 { font-size: 19px; }

    .brand svg { width: 20px; height: 20px; }
    .demo-note { display: none; }
}

// Rank search matches using exact identifiers and label prefixes.
